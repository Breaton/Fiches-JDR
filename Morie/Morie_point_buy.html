<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="lesbian.png" type="image/png">
  <title>Création de Personnage — Aequor</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

    :root {
      --bg: #0e0c0a;
      --surface: #161310;
      --surface2: #1e1a16;
      --border: #3a2e22;
      --border-bright: #6b4f2e;
      --gold: #c9934a;
      --gold-bright: #e8b86d;
      --gold-dim: #7a5830;
      --text: #d4c4a8;
      --text-dim: #7a6e5e;
      --text-bright: #f0e6d0;
      --red: #c45a3a;
      --green: #5a8a4a;
      --blue: #4a6a9a;

      /* TWEAKABLE COSTS - Attributs */
      --attr-cost-2: 1;
      --attr-cost-3: 2;
      --attr-cost-4: 3;
      --attr-cost-5: 5;
      --attr-cost-6: 8;
      --attr-cost-7: 12;

      /* TWEAKABLE COSTS - Compétences */
      --comp-cost-2: 1;
      --comp-cost-3: 2;
      --comp-cost-4: 3;
      --comp-cost-5: 5;
      --comp-cost-6: 8;

      /* TWEAKABLE BUDGET */
      --budget: 80;

      /* TWEAKABLE PYRAMIDS */
      --max-attr-7: 1;
      --max-attr-6: 2;
      --max-attr-5: 4;
      --max-comp-6: 1;
      --max-comp-5: 2;
      --max-comp-4: 4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Budget bar */
    .budget-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.8rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .budget-label {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .budget-track {
      flex: 1;
      height: 6px;
      background: var(--surface2);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .budget-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold));
      border-radius: 3px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .budget-fill.over {
      background: linear-gradient(90deg, var(--red), #e06040);
    }

    .budget-numbers {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .budget-numbers .spent {
      color: var(--gold-bright);
    }

    .budget-numbers .sep {
      color: var(--text-dim);
      margin: 0 0.3rem;
    }

    .budget-numbers .total {
      color: var(--text-dim);
    }

    .budget-numbers.over .spent {
      color: var(--red);
    }

    .budget-remaining {
      font-size: 0.85rem;
      color: var(--text-dim);
      white-space: nowrap;
      font-style: italic;
    }

    .budget-remaining.over {
      color: var(--red);
    }

    /* Settings panel */
    .settings-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .settings-toggle:hover {
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    .settings-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      animation: fadeIn 0.2s ease;
    }

    .settings-panel.open {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .settings-panel h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.8rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .setting-item label {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .setting-item input {
      width: 60px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: 'Cinzel', serif;
      font-size: 0.85rem;
      padding: 0.25rem 0.5rem;
      text-align: center;
    }

    .setting-item input:focus {
      outline: none;
      border-color: var(--gold-dim);
    }

    .settings-section-title {
      grid-column: 1 / -1;
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }

    /* Layout */
    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 900px) {
      .columns {
        grid-template-columns: 1fr;
      }
    }

    /* Section */
    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .section-header {
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .pyramid-info {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-style: italic;
    }

    /* Pyramid counters */
    .pyramid-counters {
      display: flex;
      gap: 1rem;
      padding: 0.6rem 1.2rem;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .pyramid-counter {
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .pyramid-counter .count {
      color: var(--text);
      font-weight: 600;
    }

    .pyramid-counter .count.maxed {
      color: var(--red);
    }

    .pyramid-counter .count.ok {
      color: var(--green);
    }

    /* Stat row */
    .stat-row {
      display: flex;
      align-items: center;
      padding: 0.5rem 1.2rem;
      border-bottom: 1px solid rgba(58, 46, 34, 0.4);
      gap: 0.8rem;
      transition: background 0.15s;
    }

    .stat-row:last-child {
      border-bottom: none;
    }

    .stat-row:hover {
      background: rgba(201, 147, 74, 0.04);
    }

    .stat-name {
      flex: 1;
      font-size: 0.9rem;
      color: var(--text);
    }

    .stat-alt {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-style: italic;
    }

    .stat-name-wrapper {
      flex: 1;
    }

    .stat-level {
      font-size: 0.78rem;
      color: var(--text-dim);
      width: 80px;
      text-align: center;
      font-style: italic;
    }

    .stat-cost {
      font-size: 0.75rem;
      color: var(--text-dim);
      width: 50px;
      text-align: center;
    }

    .stat-cost .cost-num {
      color: var(--gold-dim);
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn {
      width: 24px;
      height: 24px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      font-family: monospace;
      flex-shrink: 0;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--gold-dim);
      color: var(--gold);
      background: rgba(201, 147, 74, 0.1);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .value-display {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--gold-bright);
      width: 28px;
      text-align: center;
    }

    /* Dots indicator */
    .dots {
      display: flex;
      gap: 3px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: transparent;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .dot.filled {
      background: var(--gold);
      border-color: var(--gold);
      box-shadow: 0 0 4px rgba(201, 147, 74, 0.4);
    }

    /* Reset button */
    .reset-btn {
      display: block;
      margin: 1.5rem auto 0;
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.5rem 1.2rem;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }

    /* Summary */
    .summary {
      margin-top: 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.5rem;
    }

    .summary h3 {
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 1rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.4rem;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 0.2rem 0;
    }

    .summary-item .s-name {
      color: var(--text-dim);
    }

    .summary-item .s-val {
      color: var(--text);
      font-weight: 600;
    }

    .summary-item .s-level {
      color: var(--text-dim);
      font-style: italic;
      font-size: 0.75rem;
      margin-left: 0.3rem;
    }

    /* === MAÎTRISES === */

    .cost-pill {
      background: rgba(201, 147, 74, 0.15);
      color: var(--gold);
      border-radius: 8px;
      padding: 0 5px;
      font-size: 0.72rem;
    }

    .armor-toggle {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 0.82rem;
      padding: 5px 12px;
      border-radius: 3px;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: 8px;
      margin-bottom: 6px;
    }

    .armor-toggle:hover:not(.disabled) {
      border-color: #4a90c2;
      color: #4a90c2;
    }

    .armor-toggle.active {
      border-color: #4a90c2;
      color: #4a90c2;
      background: rgba(74, 144, 194, 0.12);
    }

    .armor-toggle.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .no-base-tag {
      color: var(--gold);
      font-size: 0.7em;
      margin-left: 4px;
      vertical-align: super;
    }

    .cost-sur {
      display: block;
      font-size: 0.62rem;
      color: var(--gold);
      opacity: 0.8;
      margin-top: 1px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }
  </style>
</head>

<body>
  <div class="wrapper">

    <div class="budget-bar">
      <span class="budget-label">Budget</span>
      <div class="budget-track">
        <div class="budget-fill" id="budgetFill"></div>
      </div>
      <div class="budget-numbers" id="budgetNumbers">
        <span class="spent" id="spentDisplay">0</span>
        <span class="sep">/</span>
        <span class="total" id="totalDisplay">80</span>
      </div>
      <div class="budget-remaining" id="budgetRemaining">80 restants</div>
      <button class="settings-toggle" onclick="exportToFiche()" style="border-color:var(--gold-dim);color:var(--gold)">↓
        Exporter vers Fiche</button>
      <button class="settings-toggle" onclick="importFromFiche()"
        style="border-color:rgba(126,207,207,0.4);color:#7ecfcf">↑ Importer depuis Fiche</button>
      <button class="settings-toggle" onclick="toggleSettings()">⚙ Paramètres</button>
    </div>

    <div class="settings-panel" id="settingsPanel">
      <h3>Paramètres — Coûts & Limites</h3>
      <div class="settings-grid">
        <div class="settings-section-title">Budget total</div>
        <div class="setting-item">
          <label>Budget total</label>
          <input type="number" id="s_budget" value="100" min="10" max="300" onchange="updateSettings()">
        </div>

        <div class="settings-section-title">Coûts cumulatifs — Attributs (depuis Commun 4)</div>
        <div class="setting-item"><label>Déficient (1) remboursé</label><input type="number" id="s_ac1" value="-3"
            min="-20" max="0" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Faible (2) remboursé</label><input type="number" id="s_ac2" value="-2"
            min="-20" max="0" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Médiocre (3) remboursé</label><input type="number" id="s_ac3" value="-1"
            min="-20" max="0" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Élevé (5)</label><input type="number" id="s_ac5" value="3" min="0" max="50"
            onchange="updateSettings()"></div>
        <div class="setting-item"><label>Supérieur (6)</label><input type="number" id="s_ac6" value="7" min="0" max="50"
            onchange="updateSettings()"></div>
        <div class="setting-item"><label>Prodigieux (8)</label><input type="number" id="s_ac8" value="18" min="0"
            max="60" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Exceptionnel (7)</label><input type="number" id="s_ac7" value="12" min="0"
            max="50" onchange="updateSettings()"></div>

        <div class="settings-section-title">Coûts cumulatifs — Compétences</div>
        <div class="setting-item"><label>Inapte (1) rendu</label><input type="number" id="s_cc1" value="-2" min="-10"
            max="0" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Maladroit (2) rendu</label><input type="number" id="s_cc2" value="-1" min="-10"
            max="0" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Qualifié (4)</label><input type="number" id="s_cc4" value="3" min="0" max="50"
            onchange="updateSettings()"></div>
        <div class="setting-item"><label>Excellent (5)</label><input type="number" id="s_cc5" value="6" min="0" max="50"
            onchange="updateSettings()"></div>
        <div class="setting-item"><label>Absolue (8)</label><input type="number" id="s_cc8" value="21" min="0" max="60"
            onchange="updateSettings()"></div>
        <div class="setting-item"><label>Maître (7)</label><input type="number" id="s_cc7" value="15" min="0" max="60"
            onchange="updateSettings()"></div>
        <div class="setting-item"><label>Expert (6)</label><input type="number" id="s_cc6" value="10" min="0" max="50"
            onchange="updateSettings()"></div>

        <div class="settings-section-title">Limites pyramide — Attributs</div>
        <div class="setting-item"><label>Max Exceptionnel (7)</label><input type="number" id="s_max_a7" value="99"
            min="0" max="8" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Max Supérieur (6)</label><input type="number" id="s_max_a6" value="99" min="0"
            max="8" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Max Élevé (5)</label><input type="number" id="s_max_a5" value="99" min="0"
            max="8" onchange="updateSettings()"></div>

        <div class="settings-section-title">Limites pyramide — Compétences</div>
        <div class="setting-item"><label>Max Expert (6)</label><input type="number" id="s_max_c6" value="99" min="0"
            max="21" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Max Excellent (5)</label><input type="number" id="s_max_c5" value="99" min="0"
            max="21" onchange="updateSettings()"></div>
        <div class="setting-item"><label>Max Qualifié (4)</label><input type="number" id="s_max_c4" value="99" min="0"
            max="21" onchange="updateSettings()"></div>
      </div>
    </div>

    <div class="columns">
      <!-- ATTRIBUTS -->
      <div>
        <div class="section">
          <div class="section-header">
            <span class="section-title">Attributs</span>
            <span class="pyramid-info">8 attributs</span>
          </div>
          <div class="pyramid-counters" id="attrPyramid"></div>
          <div id="attrList"></div>
        </div>
      </div>

      <!-- COMPÉTENCES -->
      <div>
        <div class="section">
          <div class="section-header">
            <span class="section-title">Compétences</span>
            <span class="pyramid-info">21 compétences</span>
          </div>
          <div class="pyramid-counters" id="compPyramid"></div>
          <div id="compList"></div>
        </div>
      </div>
    </div>

    <button class="reset-btn" onclick="resetAll()">↺ Réinitialiser</button>

    <!-- MAÎTRISES -->
  </div>

  <div class="summary" id="summary">
    <h3>Résumé du personnage</h3>
    <div id="summaryContent"></div>
  </div>

  </div>

  <script>
    // ========================
    // DATA
    // ========================

    const ATTR_LEVELS = [
      { val: 1, label: 'Déficient' },
      { val: 2, label: 'Faible' },
      { val: 3, label: 'Médiocre' },
      { val: 4, label: 'Commun' },
      { val: 5, label: 'Élevé' },
      { val: 6, label: 'Supérieur' },
      { val: 7, label: 'Exceptionnel' },
    ];

    const COMP_LEVELS = [
      { val: 1, label: 'Inapte' },
      { val: 2, label: 'Maladroit' },
      { val: 3, label: 'Ordinaire' },
      { val: 4, label: 'Qualifié' },
      { val: 5, label: 'Excellent' },
      { val: 6, label: 'Expert' },
      { val: 7, label: 'Maître' },
      { val: 8, label: 'Absolue' },
    ];

    const ATTRIBUTES = [
      { id: 'puissance', name: 'Puissance', alt: 'Force' },
      { id: 'vivacite', name: 'Vivacité', alt: 'Réflexes' },
      { id: 'precision', name: 'Précision', alt: 'Contrôle' },
      { id: 'endurance', name: 'Endurance', alt: 'Résistance' },
      { id: 'intelligence', name: 'Intelligence', alt: 'Analyse' },
      { id: 'intuition', name: 'Intuition', alt: 'Perception' },
      { id: 'volonte', name: 'Volonté', alt: 'Détermination' },
      { id: 'presence', name: 'Présence', alt: 'Magnétisme' },
    ];

    const COMPETENCES = [
      { id: 'art', name: 'Art', alt: 'Performance · Artisanat · Création' },
      { id: 'athletisme', name: 'Athlétisme', alt: 'Acrobaties · Survie · Endurance' },
      { id: 'autorite', name: 'Autorité', alt: 'Intimidation · Leadership · Commandement' },
      { id: 'apothicairerie', name: 'Apothicairerie', alt: 'Herboristerie · Botanique · Potions' },
      { id: 'bagarre', name: 'Combat', alt: 'Bagarre · Escrime · Arts martiaux · Lance' },
      { id: 'discretion', name: 'Discrétion', alt: 'Furtivité · Infiltration · Présence effacée' },
      { id: 'dressage', name: 'Dressage', alt: 'Équitation · Apprivoisement · Capture' },
      { id: 'eloquence', name: 'Éloquence', alt: 'Diplomatie · Séduction · Raison' },
      { id: 'erudition', name: 'Érudition', alt: 'Histoire · Théologie · Droit' },
      { id: 'escamotage', name: 'Escamotage', alt: 'Larcin · Crochetage · Prestidigitation' },
      { id: 'esoterisme', name: 'Ésotérisme', alt: 'Arcanes · Pouvoir · Magie', noBase: true },
      { id: 'medecine', name: 'Médecine', alt: 'Chirurgie · Soins · Premiers secours' },
      { id: 'recherche', name: 'Recherche', alt: 'Enquête · Pistage · Investigation' },
      { id: 'resilience', name: 'Résilience', alt: 'Sang-froid · Bravoure · Calme' },
      { id: 'sagacite', name: 'Sagacité', alt: 'Empathie · Intuition · Perspicacité' },
      { id: 'strategie', name: 'Stratégie', alt: 'Tactique · Commandement · Planification' },
      { id: 'technologie', name: 'Technologie', alt: 'Ingénierie · Mécanique · Sabotage' },
      { id: 'tir', name: 'Tir', alt: 'Archerie · Lancer · Arme à feu' },
      { id: 'tromperie', name: 'Tromperie', alt: 'Manipulation · Comédie · Bluff' },
      { id: 'vigilance', name: 'Vigilance', alt: 'Perception · Instinct · Observation' },
    ];

    // ========================
    // STATE
    // ========================

    let config = {
      budget: 100,
      surchargeEnabled: true,   // le pic renchérit les autres attributs
      attrCap: 8,
      // Coûts cumulatifs depuis la baseline 4 (Commun). Valeurs négatives = remboursement.
      attrCosts: [0, -2, -1, 0, 0, 3, 7, 12, 18],
      compCosts: [0, -2, -1, 0, 3, 6, 10, 15, 21],
      maxAttr: {},
      maxComp: {},
      compCap: 8,
      // Seuil au-delà duquel chaque niveau ajoute à la surcharge
      attrThreshold: 5,
      compThreshold: 6,
      compReliefCap: 8,        // plafond global des lacunes
      compReliefPerSkill: 1,   // une compétence n'allège jamais de plus de 1
      compRefundCap: 6,        // total maximum rendu au pool par les lacunes
      noBaseEntry: 3,     // surcoût d'accès pour une compétence sans socle (Ésotérisme)
    };

    let attrValues = {};
    let compValues = {};
    ATTRIBUTES.forEach(a => attrValues[a.id] = 4);
    COMPETENCES.forEach(c => compValues[c.id] = c.noBase ? 0 : 3);

    // ========================
    // COST CALCULATION
    // ========================

    function attrCost(val) {
      return config.attrCosts[val] || 0;
    }

    function compCost(val, comp) {
      // Une compétence sans socle (Ésotérisme) se paie depuis 0 : aucun remboursement
      if (comp && comp.noBase) {
        const base = config.compCosts[COMP_BASE] || 0;
        return (config.compCosts[val] || 0) - base + (config.noBaseEntry || 0) * (val > 0 ? 1 : 0);
      }
      return config.compCosts[val] || 0;
    }

    // ========================
    // SURCHARGE DE SPÉCIALISATION
    // ========================
    // Le pic renchérit chaque niveau acheté au-dessus de Commun sur les AUTRES attributs.
    // Chaque attribut sous Commun réduit la surcharge de sa propre distance.

    // Base neutre : Commun (4) pour les attributs, Qualifié (4) pour les compétences
    const ATTR_BASE = 4;
    const COMP_BASE = 3;

    // Excès généré par UNE valeur : ce qui dépasse le seuil
    function excessOf(v, th) { return Math.max(0, v - th); }

    // Côté compétences, la surcharge démarre à Excellent et croît de 1 par cran
    const COMP_SURCHARGE_FROM = 5;   // Excellent : premier niveau qui génère et subit la surcharge
    const COMP_EXCESS = { 5: 1, 6: 2, 7: 3, 8: 4 };
    function compExcessOf(v) { return COMP_EXCESS[v] || 0; }

    // Taux subi par un attribut donné : excès de TOUS LES AUTRES, moins les faiblesses
    function attrRateFor(id) {
      const th = config.attrThreshold;
      let brut = 0;
      ATTRIBUTES.forEach(a => { if (a.id !== id) brut += excessOf(attrValues[a.id], th); });
      const relief = ATTRIBUTES
        .filter(a => a.id !== id && attrValues[a.id] < ATTR_BASE)
        .reduce((s, a) => s + (ATTR_BASE - attrValues[a.id]), 0);
      return Math.max(0, brut - relief);
    }

    // Idem côté compétences, sans allègement
    function compRateFor(id) {
      let brut = 0, relief = 0;
      COMPETENCES.forEach(x => {
        if (x.id === id) return;
        brut += compExcessOf(compValues[x.id]);
        if (!x.noBase && compValues[x.id] < COMP_BASE) {
          relief += Math.min(COMP_BASE - compValues[x.id], config.compReliefPerSkill);
        }
      });
      return Math.max(0, brut - Math.min(relief, config.compReliefCap));
    }

    // Coût de surcharge d'une ligne : taux subi × niveaux achetés au-dessus de la base
    // La surcharge s'applique une seule fois par ligne investie au-dessus de la base.
    // Le taux subi est la surcharge globale moins celle que la ligne génère elle-même.
    function attrSurchargeCost(id) {
      return attrValues[id] > ATTR_BASE ? attrRateFor(id) : 0;
    }

    // La surcharge n'est payée qu'à partir d'Excellent, comme elle n'est générée qu'à partir de là
    function compSurchargeCost(id) {
      return compValues[id] >= COMP_SURCHARGE_FROM ? compRateFor(id) : 0;
    }

    function surchargeAttr() {
      const vals = ATTRIBUTES.map(a => attrValues[a.id]);
      const th = config.attrThreshold;
      const brut = vals.reduce((s, v) => s + excessOf(v, th), 0);
      const relief = vals.filter(v => v < ATTR_BASE).reduce((s, v) => s + (ATTR_BASE - v), 0);
      const cost = ATTRIBUTES.reduce((s, a) => s + attrSurchargeCost(a.id), 0);
      return { peak: Math.max(...vals), brut, relief, rate: Math.max(0, brut - relief), cost };
    }

    function surchargeComp() {
      const vals = COMPETENCES.map(x => compValues[x.id]);
      const brut = vals.reduce((s, v) => s + compExcessOf(v), 0);
      const reliefRaw = COMPETENCES
        .filter(x => !x.noBase && compValues[x.id] < COMP_BASE)
        .reduce((s, x) => s + Math.min(COMP_BASE - compValues[x.id], config.compReliefPerSkill), 0);
      const relief = Math.min(reliefRaw, config.compReliefCap);
      const cost = COMPETENCES.reduce((s, x) => s + compSurchargeCost(x.id), 0);
      return { peak: Math.max(...vals), brut, relief, rate: Math.max(0, brut - relief), cost };
    }

    function surchargeInfo() { return surchargeAttr(); }

    // Total rendu par les compétences sous Ordinaire, borné par compRefundCap
    function compRefundTotal() {
      const raw = COMPETENCES
        .filter(x => !x.noBase)
        .reduce((s, x) => s + Math.min(0, config.compCosts[compValues[x.id]] || 0), 0);
      return Math.max(raw, -config.compRefundCap);
    }

    function totalSpent() {
      let total = 0;
      ATTRIBUTES.forEach(a => total += attrCost(attrValues[a.id]));
      // Les coûts positifs seuls ici : les remboursements passent par compRefundTotal
      COMPETENCES.forEach(c => total += Math.max(0, compCost(compValues[c.id], c)));
      total += compRefundTotal();
      if (config.surchargeEnabled) total += surchargeAttr().cost + surchargeComp().cost;
      return total;
    }

    // ========================
    // PYRAMID CHECK
    // ========================

    function attrCountAt(level) {
      return ATTRIBUTES.filter(a => attrValues[a.id] === level).length;
    }

    function compCountAt(level) {
      return COMPETENCES.filter(c => compValues[c.id] === level).length;
    }

    function canIncreaseAttr(id) {
      const cur = attrValues[id];
      const next = cur + 1;
      if (next > config.attrCap) return { ok: false, reason: 'Maximum atteint' };
      const limit = config.maxAttr[next];
      if (limit !== undefined && attrCountAt(next) >= limit) {
        return { ok: false, reason: `Limite pyramide (${limit} max)` };
      }
      const cost = attrCost(next) - attrCost(cur);
      if (totalSpent() + cost > config.budget) return { ok: false, reason: 'Budget insuffisant' };
      return { ok: true, cost };
    }


    function canIncreaseComp(id) {
      const cur = compValues[id];
      const next = cur + 1;
      if (next > config.compCap) return { ok: false, reason: 'Maximum atteint' };
      const limit = config.maxComp[next];
      if (limit !== undefined && compCountAt(next) >= limit) {
        return { ok: false, reason: `Limite pyramide (${limit} max)` };
      }
      const cost = compCost(next) - compCost(cur);
      if (totalSpent() + cost > config.budget) return { ok: false, reason: 'Budget insuffisant' };
      return { ok: true, cost };
    }

    // ========================
    // RENDER
    // ========================

    // Un seul compteur signé : négatif = marge de spécialisation, positif = surcharge
    function balanceHtml(s, titleBalance, titleRate) {
      const balance = Math.max(0, s.brut - s.relief);   // jamais négatif
      const cls = balance > 0 ? 'maxed' : 'ok';
      const label = balance > 0 ? 'Surcharge' : 'Équilibre';
      let h = `<span class="pyramid-counter" title="${titleBalance}">${label} : <span class="count ${cls}">${balance > 0 ? '+' : ''}${balance}</span></span>`;
      if (s.rate > 0) {
        h += `<span class="pyramid-counter" title="${titleRate}"><span class="count maxed">+${s.rate}</span> max</span>`;
        if (s.cost > 0) h += `<span class="pyramid-counter" style="opacity:0.75">soit <span class="count maxed">${s.cost}</span> pts</span>`;
      }
      return h;
    }

    function renderAttrPyramid() {
      const el = document.getElementById('attrPyramid');
      if (!config.surchargeEnabled) { el.innerHTML = ''; return; }
      const s = surchargeInfo();
      el.innerHTML = balanceHtml(s,
        'Excès : Supérieur +1, Exceptionnel +2, Prodigieux +3 — moins les faiblesses sous Commun',
        'Surcharge appliquée une fois à chaque attribut investi au-dessus de Commun');
    }

    function renderCompPyramid() {
      const el = document.getElementById('compPyramid');
      if (config.surchargeEnabled) {
        const s = surchargeComp();
        let h = balanceHtml(s,
          `Excès : Excellent +1, Expert +2, Maître +3, Absolue +4 — chaque compétence sous Ordinaire allège de 1 au plus (total max ${config.compReliefCap})`,
          "Surcharge appliquée une fois à chaque compétence à Excellent ou au-delà");
        const refund = compRefundTotal();
        if (refund < 0) {
          h += `<span class="pyramid-counter" title="Points rendus par les compétences sous Ordinaire (max ${config.compRefundCap})">Rendu : <span class="count ok">${refund}</span> pts</span>`;
        }
        el.innerHTML = h;
        return;
      }
      let html = '';
      [[6, 'Expert'], [5, 'Excellent']].forEach(([level, label]) => {
        const count = compCountAt(level);
        const max = config.maxComp[level];
        const cls = max !== undefined && count >= max ? 'maxed' : 'ok';
        const maxStr = max !== undefined ? `/${max}` : '';
        html += `<span class="pyramid-counter">${label} : <span class="count ${cls}">${count}${maxStr}</span></span>`;
      });
      el.innerHTML = html;
    }

    function renderAttrList() {
      const el = document.getElementById('attrList');
      el.innerHTML = ATTRIBUTES.map(a => {
        const val = attrValues[a.id];
        const levelLabel = ATTR_LEVELS.find(l => l.val === val)?.label || '';
        const costVal = attrCost(val);
        const sur = config.surchargeEnabled ? attrSurchargeCost(a.id) : 0;
        const rate = config.surchargeEnabled ? attrRateFor(a.id) : 0;
        const costDisplay = costVal < 0
          ? `<span class="cost-num" style="color:var(--green)">${costVal} pts</span>`
          : `<span class="cost-num">${costVal + sur}</span> pts` +
          (sur > 0 ? `<span class="cost-sur" title="Surcharge subie : +${rate} (global moins ce que cette ligne génère)">${costVal} + ${sur}</span>` : '');
        const canUp = canIncreaseAttr(a.id);
        const canDown = val > 1;

        const dots = ATTR_LEVELS.map(l =>
          `<div class="dot ${l.val <= val ? 'filled' : ''}"></div>`
        ).join('');

        return `<div class="stat-row">
      <div class="stat-name-wrapper">
        <div class="stat-name">${a.name}</div>
        <div class="stat-alt">${a.alt}</div>
      </div>
      <div class="dots">${dots}</div>
      <div class="stat-level">${levelLabel}</div>
      <div class="stat-cost">${costDisplay}</div>
      <div class="controls">
        <button class="btn" onclick="changeAttr('${a.id}', -1)" ${!canDown ? 'disabled' : ''}>−</button>
        <span class="value-display">${val}</span>
        <button class="btn" onclick="changeAttr('${a.id}', 1)" ${!canUp.ok ? 'disabled' : ''} title="${canUp.ok ? '' : canUp.reason}">+</button>
      </div>
    </div>`;
      }).join('');
    }

    function renderCompList() {
      const el = document.getElementById('compList');
      el.innerHTML = COMPETENCES.map(c => {
        const val = compValues[c.id];
        const levelLabel = val === 0 ? 'Aucune' : (COMP_LEVELS.find(l => l.val === val)?.label || '');
        const costVal = compCost(val, c);
        const sur = config.surchargeEnabled ? compSurchargeCost(c.id) : 0;
        const rate = config.surchargeEnabled ? compRateFor(c.id) : 0;
        const canUp = canIncreaseComp(c.id);
        const canDown = val > 1;

        const dots = COMP_LEVELS.map(l =>
          `<div class="dot ${l.val <= val ? 'filled' : ''}"></div>`
        ).join('');

        return `<div class="stat-row">
      <div class="stat-name-wrapper">
        <div class="stat-name">${c.name}${c.noBase ? '<span class="no-base-tag" title="Aucun socle : se paie depuis zéro">✦</span>' : ''}</div>
        <div class="stat-alt">${c.alt}</div>
      </div>
      <div class="dots">${dots}</div>
      <div class="stat-level">${levelLabel}</div>
      <div class="stat-cost"><span class="cost-num">${costVal + sur}</span> pts${sur > 0 ? `<span class="cost-sur" title="Surcharge subie : +${rate} (global moins ce que cette ligne génère)">${costVal} + ${sur}</span>` : ''}</div>
      <div class="controls">
        <button class="btn" onclick="changeComp('${c.id}', -1)" ${!canDown ? 'disabled' : ''}>−</button>
        <span class="value-display">${val}</span>
        <button class="btn" onclick="changeComp('${c.id}', 1)" ${!canUp.ok ? 'disabled' : ''} title="${canUp.ok ? '' : canUp.reason}">+</button>
      </div>
    </div>`;
      }).join('');
    }

    function renderBudget() {
      const spent = totalSpent();
      const pct = Math.min((spent / config.budget) * 100, 100);
      const over = spent > config.budget;
      const remaining = config.budget - spent;

      document.getElementById('budgetFill').style.width = pct + '%';
      document.getElementById('budgetFill').classList.toggle('over', over);
      document.getElementById('spentDisplay').textContent = spent;
      document.getElementById('totalDisplay').textContent = config.budget;
      document.getElementById('budgetNumbers').classList.toggle('over', over);
      document.getElementById('budgetRemaining').textContent = over
        ? `${Math.abs(remaining)} de trop`
        : `${remaining} restants`;
      document.getElementById('budgetRemaining').classList.toggle('over', over);
    }

    function renderSummary() {
      const el = document.getElementById('summaryContent');

      const attrInvested = ATTRIBUTES.filter(a => attrValues[a.id] > 1)
        .sort((a, b) => attrValues[b.id] - attrValues[a.id]);
      const compInvested = COMPETENCES.filter(c => compValues[c.id] > 1)
        .sort((a, b) => compValues[b.id] - compValues[a.id]);

      if (attrInvested.length === 0 && compInvested.length === 0) {
        el.innerHTML = '<p style="color:var(--text-dim);font-style:italic">Aucun point investi pour l\'instant.</p>';
        return;
      }

      let html = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem">';

      if (attrInvested.length > 0) {
        html += '<div>';
        html += '<div style="font-family:Cinzel,serif;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem">Attributs</div>';
        html += '<div class="summary-grid">';
        attrInvested.forEach(a => {
          const label = ATTR_LEVELS.find(l => l.val === attrValues[a.id])?.label || '';
          html += `<div class="summary-item"><span class="s-name">${a.name}</span><span><span class="s-val">${attrValues[a.id]}</span><span class="s-level">${label}</span></span></div>`;
        });
        html += '</div></div>';
      }

      if (compInvested.length > 0) {
        html += '<div>';
        html += '<div style="font-family:Cinzel,serif;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:0.5rem">Compétences</div>';
        html += '<div class="summary-grid">';
        compInvested.forEach(c => {
          const label = COMP_LEVELS.find(l => l.val === compValues[c.id])?.label || '';
          html += `<div class="summary-item"><span class="s-name">${c.name}</span><span><span class="s-val">${compValues[c.id]}</span><span class="s-level">${label}</span></span></div>`;
        });
        html += '</div></div>';
      }

      html += '</div>';

      el.innerHTML = html;
    }

    function render() {
      renderBudget();
      renderAttrPyramid();
      renderCompPyramid();
      renderAttrList();
      renderCompList();
      renderSummary();
    }

    function resetAll() {
      ATTRIBUTES.forEach(a => attrValues[a.id] = 4);
      COMPETENCES.forEach(c => compValues[c.id] = c.noBase ? 0 : 3);
      render();
    }

    function changeAttr(id, delta) {
      if (delta > 0) {
        const check = canIncreaseAttr(id);
        if (!check.ok) return;
        attrValues[id]++;
      } else {
        if (attrValues[id] <= 1) return;
        attrValues[id]--;
      }
      render();
    }

    function changeComp(id, delta) {
      if (delta > 0) {
        const check = canIncreaseComp(id);
        if (!check.ok) return;
        compValues[id]++;
      } else {
        const comp = COMPETENCES.find(x => x.id === id);
        const floor = comp && comp.noBase ? 0 : 1;
        if (compValues[id] <= floor) return;
        compValues[id]--;
      }
      render();
    }

    function exportToFiche() {
      const skillNames = {
        art: 'Art', athletisme: 'Athlétisme', autorite: 'Autorité',
        apothicairerie: 'Apothicairerie', bagarre: 'Combat',
        discretion: 'Discrétion', dressage: 'Dressage', eloquence: 'Éloquence',
        erudition: 'Érudition', escamotage: 'Escamotage', esoterisme: 'Ésotérisme',
        medecine: 'Médecine', recherche: 'Recherche', resilience: 'Résilience',
        sagacite: 'Sagacité', strategie: 'Stratégie', technologie: 'Technologie',
        tir: 'Tir', tromperie: 'Tromperie', vigilance: 'Vigilance'
      };

      const skills = COMPETENCES.map((c, i) => ({
        id: `regular_${i}`,
        name: skillNames[c.id] || c.name,
        level: Math.max(c.noBase ? 0 : 1, compValues[c.id]),
        isBase: true
      }));

      const ELAN_CONTRIB = { 1: 1, 2: 2, 3: 3, 4: 5, 5: 7, 6: 9, 7: 12, 8: 15 };
      const endurance = attrValues['endurance'] || 4;
      const volonte = attrValues['volonte'] || 4;
      const elanMax = ELAN_CONTRIB[endurance] + ELAN_CONTRIB[volonte];

      const state = {
        profile: { name: '', image: null },
        attributes: {
          puissance: attrValues['puissance'],
          vivacite: attrValues['vivacite'],
          precision: attrValues['precision'],
          endurance: attrValues['endurance'],
          intelligence: attrValues['intelligence'],
          intuition: attrValues['intuition'],
          volonte: attrValues['volonte'],
          presence: attrValues['presence']
        },
        counters: {
          health: { current: elanMax, max: elanMax },
          power: { current: elanMax, max: elanMax }
        },
        customResources: [],
        skills: skills,
        wounds: [],
        objects: [],
        magic: { reserveUsed: 0, mjDice: 0 },
        currentModal: null
      };

      const json = JSON.stringify(state, null, 2);
      // Sauvegarde dans localStorage pour ouverture automatique de la fiche
      localStorage.setItem('aequor_pb_export', JSON.stringify(state));
      // Téléchargement JSON de secours
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'personnage.json';
      a.click();
      URL.revokeObjectURL(url);
      // Ouvre la fiche dans un nouvel onglet
      window.open('Morie_fiche.html', '_blank');
    }

    function importFromFiche() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = evt => {
          try { loadFicheJSON(JSON.parse(evt.target.result)); }
          catch { alert('Fichier JSON invalide ou non reconnu.'); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    // Une fiche antérieure peut dépasser les limites actuelles : on les assouplit pour elle
    function relaxConstraintsForLegacy() {
      return false;   // plus de limites par niveau : la surcharge régule seule
    }

    function loadFicheJSON(data) {
      const nameToId = Object.fromEntries(COMPETENCES.map(c => [c.name, c.id]));
      const aliases = {
        'Ésotérisme': 'esoterisme', 'Éloquence': 'eloquence', 'Érudition': 'erudition',
        'Résilience': 'resilience', 'Sagacité': 'sagacite', 'Stratégie': 'strategie',
        'Athlétisme': 'athletisme', 'Autorité': 'autorite', 'Discrétion': 'discretion',
        'Combat': 'bagarre', 'Bagarre': 'bagarre',
      };
      if (data.attributes) {
        Object.entries(data.attributes).forEach(([k, v]) => { if (k in attrValues) attrValues[k] = Math.max(1, Math.min(8, Number(v))); });
      }
      if (data.skills) {
        data.skills.forEach(s => {
          const id = nameToId[s.name] || aliases[s.name];
          if (!id) return;
          const comp = COMPETENCES.find(x => x.id === id);
          const floor = comp && comp.noBase ? 0 : 1;
          compValues[id] = Math.max(floor, Math.min(8, Number(s.level)));
        });
      }
      const relaxed = relaxConstraintsForLegacy();
      render();
      alert('✓ Personnage chargé depuis la fiche !'
        + (relaxed ? '\n\nNote : cette fiche dépasse certaines limites actuelles. Elles ont été assouplies pour la conserver telle quelle.' : ''));
    }

    function toggleSettings() {
      document.getElementById('settingsPanel').classList.toggle('open');
    }

    function updateSettings() {
      config.budget = parseInt(document.getElementById('s_budget').value) || 60;
      config.attrCosts = [0,
        parseInt(document.getElementById('s_ac1').value) || 0,
        parseInt(document.getElementById('s_ac2').value) || 0,
        parseInt(document.getElementById('s_ac3').value) || 0,
        0, // Commun (4) = baseline = 0
        parseInt(document.getElementById('s_ac5').value) || 0,
        parseInt(document.getElementById('s_ac6').value) || 0,
        parseInt(document.getElementById('s_ac7').value) || 0,
        parseInt(document.getElementById('s_ac8').value) || 0,
      ];
      config.compCosts = [0,
        parseInt(document.getElementById('s_cc1')?.value) || -2,
        parseInt(document.getElementById('s_cc2').value) || 0,
        0, // Ordinaire (3) = baseline = 0
        parseInt(document.getElementById('s_cc4').value) || 0,
        parseInt(document.getElementById('s_cc5').value) || 0,
        parseInt(document.getElementById('s_cc6').value) || 0,
        parseInt(document.getElementById('s_cc7').value) || 0,
        parseInt(document.getElementById('s_cc8').value) || 0,
      ];
      config.maxAttr = {
        7: parseInt(document.getElementById('s_max_a7').value) || 0,
        6: parseInt(document.getElementById('s_max_a6').value) || 0,
        5: parseInt(document.getElementById('s_max_a5').value) || 99,
      };
      config.maxComp = {
        6: parseInt(document.getElementById('s_max_c6').value) || 0,
        5: parseInt(document.getElementById('s_max_c5').value) || 0,
        4: parseInt(document.getElementById('s_max_c4').value) || 99,
      };
      render();
    }

    // ========================

    render();
