<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout : un plan de travail d'apothicaire. Étapes de la cour à gauche, ordonnance scellée à droite. */
:root{
  --paper:#EDF0EB; --card:#F8FAF6; --ink:#1C2320; --muted:#5A6661; --line:#CBD4CE;
  --jade:#2D6A55; --jade-soft:#DCE8E1; --cinnabar:#AE3A2A; --cinnabar-soft:#F3DFDA;
  --gold:#8E7128; --gold-soft:#F1E8D0;
  --t-2:#33669A; --t-1:#5E93B5; --t0:#7D8783; --t1:#BF8636; --t2:#B4462F;
  --r-as:#2D6A55; --r-de:#A87A22; --r-hu:#2F7A86; --r-oc:#7A5A88;
  --display:"Shippori Mincho","Noto Serif SC","Songti SC",Georgia,serif;
  --body:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --radius:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#131816; --card:#1B211F; --ink:#E3E9E5; --muted:#97A39D; --line:#2D3632;
  --jade:#71B89C; --jade-soft:#1D2E27; --cinnabar:#E27866; --cinnabar-soft:#3A221E;
  --gold:#D3B262; --gold-soft:#332C19;
  --t-2:#7FA9DA; --t-1:#93BED6; --t0:#9AA59F; --t1:#DCAA5E; --t2:#E57D63;
  --r-as:#71B89C; --r-de:#D3A74E; --r-hu:#6BBAC6; --r-oc:#B596C3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#131816; --card:#1B211F; --ink:#E3E9E5; --muted:#97A39D; --line:#2D3632;
  --jade:#71B89C; --jade-soft:#1D2E27; --cinnabar:#E27866; --cinnabar-soft:#3A221E;
  --gold:#D3B262; --gold-soft:#332C19;
  --t-2:#7FA9DA; --t-1:#93BED6; --t0:#9AA59F; --t1:#DCAA5E; --t2:#E57D63;
  --r-as:#71B89C; --r-de:#D3A74E; --r-hu:#6BBAC6; --r-oc:#B596C3; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
.hz{font-family:var(--display)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

/* En-tête */
header.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;gap:14px;align-items:center}
.seal{width:52px;height:52px;flex:none;background:var(--cinnabar);color:var(--paper);display:grid;place-items:center;
  font-family:var(--display);font-size:30px;font-weight:800;border-radius:4px;transform:rotate(-3deg)}
.brand h1{font-size:clamp(1.6rem,3.5vw,2.2rem);line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--jade);color:var(--paper)}

/* Réserve */
.reserve{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px;font-size:.92rem}
.reserve .lbl{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;color:var(--muted)}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk input{accent-color:var(--jade)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* Grille compositeur */
.compose{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:980px){.compose{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.steps{display:grid;gap:16px;min-width:0}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.step-h{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.step-n{font-family:var(--display);font-weight:800;color:var(--jade);font-size:1.05rem;min-width:1.4em}
.step-h h2{font-size:1.25rem}
.step-h .role{font-family:var(--display);color:var(--muted);font-size:1rem}
.step .hint{color:var(--muted);margin:0 0 12px;font-size:.95rem;max-width:68ch}
.step.locked{opacity:.55}

/* Maux */
.mgroups{display:grid;gap:10px}
.mgroup{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.mgroup .gl{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;width:100%}
.mal{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:.92rem}
.mal:hover{border-color:var(--jade)}
.mal[aria-pressed="true"]{background:var(--jade);color:var(--paper);border-color:var(--jade)}
.maldesc{margin-top:12px;padding:10px 12px;border-left:3px solid var(--jade);background:var(--jade-soft);font-size:.93rem;border-radius:0 var(--radius) var(--radius) 0}

/* Cartes plantes candidates */
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.cand{text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:var(--radius);padding:10px 12px;cursor:pointer;display:grid;gap:4px;min-width:0;position:relative}
.cand:hover{border-color:var(--jade)}
.cand[aria-pressed="true"]{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade);background:var(--jade-soft)}
.cand .nm{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding-right:22px}
.cand .py{color:var(--muted);font-size:.85rem}
.cand .why{font-size:.84rem}
.cand .tick{position:absolute;top:8px;right:10px;font-family:var(--display);color:var(--jade);font-weight:800;display:none}
.cand[aria-pressed="true"] .tick{display:block}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.74rem;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.risk{border-color:var(--cinnabar);color:var(--cinnabar)}
.chip.fix{border-color:var(--jade);color:var(--jade)}
.chip.gold{border-color:var(--gold);color:var(--gold)}
.nat{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;color:var(--paper);white-space:nowrap}
.tox{font-size:.72rem;font-weight:700;color:var(--cinnabar)}
.more{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;color:var(--jade);cursor:pointer;padding:0;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.empty{color:var(--muted);font-style:italic;font-size:.93rem}
.dim{opacity:.6}

/* Contexte forme */
.ctx{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tog{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.forms{display:grid;gap:6px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:.9rem}
.frow .fn{display:flex;gap:6px;align-items:baseline}
.frow .fn .hz{font-size:1.05rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);border-radius:4px}
.frow.best .bar i{background:var(--gold)}
.frow .sc{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.why-form{margin-top:12px;font-size:.92rem}
.why-form ul{margin:6px 0 0;padding-left:18px}

/* Ordonnance */
.ord{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;display:grid;gap:14px;min-width:0}
@media (min-width:980px){.ord{position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto}}
.ord .eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.ord h2{font-size:1.45rem;line-height:1.2}
.ord .fhz{font-family:var(--display);color:var(--cinnabar);font-size:1.1rem}
.court{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.court li{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;align-items:start;padding-bottom:8px;border-bottom:1px dashed var(--line)}
.court .rl{font-family:var(--display);font-weight:700;font-size:.92rem}
.court .rl small{display:block;color:var(--muted);font-family:var(--body);font-weight:400;font-size:.76rem}
.court .pl{min-width:0}
.court .pl b{font-weight:700}
.court .pl .py{color:var(--muted);font-size:.84rem}
.court .pz{font-size:.82rem;color:var(--gold);margin-top:2px}
.rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:0 0 0 4px}
.rm:hover{color:var(--cinnabar)}
.thermo{display:grid;gap:4px}
.thermo .scale{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--t-2),var(--t-1),var(--t0),var(--t1),var(--t2))}
.thermo .mk{position:absolute;top:-4px;width:4px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-2px)}
.thermo .tg{position:absolute;top:-3px;height:18px;border:2px dashed var(--ink);border-radius:4px;opacity:.55}
.thermo .lg{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.alerts{display:grid;gap:6px}
.alert{font-size:.88rem;padding:8px 10px;border-radius:var(--radius);border-left:3px solid var(--cinnabar);background:var(--cinnabar-soft)}
.alert.ok{border-color:var(--jade);background:var(--jade-soft)}
.alert.gold{border-color:var(--gold);background:var(--gold-soft)}
.voice{display:grid;gap:6px}
.voice p{margin:0;font-family:var(--display);font-size:.98rem;line-height:1.45;padding-left:12px;border-left:2px solid var(--jade)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--jade);background:var(--jade);color:var(--paper);border-radius:var(--radius);padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--jade)}
.copied{font-size:.85rem;color:var(--jade)}
textarea.copyfb{width:100%;min-height:120px;font:inherit;font-size:.85rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:8px}

/* Herbier */
.hfilters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.hfilters input[type=search],.hfilters select{font:inherit;font-size:.93rem;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);color:var(--ink);min-width:0}
.hfilters input[type=search]{flex:1 1 220px}
.rchips{display:flex;gap:6px;flex-wrap:wrap}
.rchip{border:1px solid var(--line);background:var(--paper);padding:5px 11px;border-radius:999px;cursor:pointer;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.rchip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.hcount{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.hcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:8px;align-content:start;min-width:0}
.hcard.poison{border-color:var(--cinnabar)}
.hcard .top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.hcard h3{font-size:1.12rem;line-height:1.25}
.hcard .hz{font-size:1.35rem;color:var(--muted);flex:none}
.hcard .py{color:var(--muted);font-size:.88rem;margin-top:-6px}
.hcard .orig{font-size:.85rem;display:flex;gap:6px;align-items:baseline}
.hcard .x{font-size:.9rem;margin:0}
.hcard .pz{font-size:.84rem;color:var(--gold);margin:0}
.hcard .add{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted);padding-top:6px;border-top:1px dashed var(--line)}
.hcard .add button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:2px 9px;cursor:pointer;font-size:.8rem}
.hcard .add button:hover{border-color:var(--jade);color:var(--jade)}
.kv{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 8px;font-size:.84rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:.9rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:520px){.frow{grid-template-columns:110px minmax(0,1fr) 30px}.court li{grid-template-columns:74px minmax(0,1fr)}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">藥</div>

        <h1>Officine de Shuhui</h1>

</div>

<script>
/* ---------- Référentiels ---------- */
const REG={as:{n:"Asie",c:"--r-as"},de:{n:"Terres arides",c:"--r-de"},hu:{n:"Terres humides",c:"--r-hu"},oc:{n:"Occident",c:"--r-oc"}};
const NAT={"-2":"froide","-1":"fraîche","0":"neutre","1":"tiède","2":"chaude"};
const ACT={
 "surf-froid":"Chasser le froid de surface","surf-chaud":"Chasser la chaleur de surface","chaleur":"Rafraîchir la chaleur",
 "toxines":"Éliminer les toxines","purge":"Purger","humid":"Drainer l'humidité","digest":"Aider la digestion","nausee":"Arrêter la nausée",
 "rechauf":"Réchauffer l'intérieur","qi":"Faire circuler le qi","sang-c":"Faire circuler le sang","sang-s":"Arrêter le sang",
 "plaie":"Cicatriser","douleur":"Calmer la douleur","toux":"Calmer la toux","glaires":"Résoudre les glaires","reveil":"Réveiller, ouvrir les orifices",
 "esprit":"Calmer l'esprit","t-qi":"Tonifier le qi","t-sang":"Tonifier le sang","t-yin":"Nourrir le yin","t-yang":"Tonifier le yang",
 "retenir":"Retenir ce qui fuit","antidote":"Contrer un poison"};
const RISK={
 estomac:{n:"Blesse l'estomac",p:"blesse l'estomac"},froid:{n:"Refroidit trop",p:"refroidit trop le corps"},
 desseche:{n:"Dessèche le yin",p:"dessèche et brûle le yin"},lourd:{n:"Lourd à digérer",p:"pèse sur la digestion"},
 sueur:{n:"Épuise par la sueur",p:"épuise par la sueur"},toxique:{n:"Toxique",p:"est toxique"},
 saigne:{n:"Peut faire saigner",p:"peut faire saigner"},stase:{n:"Laisse des stases",p:"risque de laisser une stase"},
 epuise:{n:"Épuise un corps faible",p:"épuise un corps faible"},assech:{n:"Assèche les liquides",p:"assèche les liquides"},
 torpeur:{n:"Alourdit l'esprit",p:"alourdit l'esprit"},violent:{n:"Brutal",p:"brutalise le corps"}};
const ZONE={surface:"la surface, la peau",haut:"la gorge et les poumons",tete:"la tête",bas:"le bas du corps",membres:"les membres",foie:"le foie et les émotions",coeur:"le cœur et l'esprit",interieur:"l'intérieur"};
const FORMS={
 tang:{n:"Décoction",h:"湯",py:"tāng",d:"Bouillie longuement, bue chaude. Action rapide et forte."},
 san:{n:"Poudre",h:"散",py:"sǎn",d:"Broyée fin. Se transporte, se délaie ou se saupoudre sur une plaie."},
 wan:{n:"Pilule",h:"丸",py:"wán",d:"Poudre liée au miel. Action lente, dose maîtrisée."},
 gao:{n:"Onguent",h:"膏",py:"gāo",d:"Pâte grasse ou cireuse appliquée sur la peau."},
 jiu:{n:"Vin médicinal",h:"酒",py:"jiǔ",d:"Macéré dans l'alcool de riz. Fait circuler et réchauffe."},
 inh:{n:"Inhalation",h:"嗅",py:"xiù",d:"Respirée, en vapeur ou en fumigation. Agit sur l'instant."},
 dan:{n:"Élixir",h:"丹",py:"dān",d:"Raffiné en cycles répétés. Rare, précieux, nourrit la vie."}};

/* ---------- Plantes ----------
 r région · o origine · t nature (-2..2) · s saveur · a effets · f force (1..3)
 k risques · c risques corrigés · e envoyé vers · fm formes adaptées · u usage (i interne, e externe, b les deux)
 tox 1 toxique, 2 très toxique, 3 poison sans usage · g interdit grossesse · rare · pz préparation · x en jeu */
const P=[];
function p(id,n,h,py,r,o,t,s,a,f,x,opt){P.push(Object.assign({id,n,h,py,r,o,t,s,a,f,x,k:[],c:[],e:[],fm:["tang"],u:"i",tox:0,g:0,rare:0,pz:""},opt||{}))}

// Surface
p("mahuang","Éphédra","麻黃","Má huáng","de","Steppes arides du nord de la Chine et de Mongolie",1,"piquante, amère",["surf-froid","toux"],3,"Très puissante : jamais seule, jamais sur un corps affaibli.",{k:["sueur","epuise"],e:["surface"],fm:["tang","san"],g:1});
p("guizhi","Rameau de cannelier","桂枝","Guì zhī","hu","Forêts chaudes du sud de la Chine",1,"piquante, douce",["surf-froid","rechauf","douleur"],2,"Avec la pivoine blanche, il équilibre surface et intérieur.",{k:["desseche"],c:["sueur"],e:["membres","surface"],fm:["tang","jiu"]});
p("shengjiang","Gingembre frais","生薑","Shēng jiāng","hu","Asie du Sud-Est tropicale, cultivé dans tout le sud",1,"piquante",["surf-froid","nausee","digest"],1,"Correcteur universel : protège l'estomac et neutralise certaines toxicités.",{c:["estomac","froid","toxique"],e:["harmonie"],fm:["tang","jiu"]});

/* ---------- Scores ---------- */
function scoreArb(x,m){
  if(!x.a.includes(m.m))return show.arb?0.1+x.a.filter(a=>m.s.includes(a)).length:-1;
  let s=10+x.f*2+3*x.a.filter(a=>m.s.includes(a)).length;
  if(m.need!=null)s-=Math.abs(x.t-m.need)*1.5;
  if(x.tox)s-=2*x.tox; if(S.preg&&x.g)s-=8; if(m.ext&&x.u==="e")s+=1; if(!m.ext&&x.u==="e")s-=6;
  return s}
function scoreCons(x,m,arb){
  let s=0,why=[];
  if(x.a.includes(m.m)){s+=6;why.push("Renforce : "+ACT[m.m])}
  m.s.forEach(a=>{if(x.a.includes(a)){s+=4;why.push("Traite : "+ACT[a])}});
  if(!s&&!show.cons)return{s:-1};
  if(m.need!=null)s-=Math.abs(x.t-m.need);else if(arb&&Math.abs(x.t-arb.t)>=3)s-=3;
  s-=x.k.length; if(x.tox)s-=2*x.tox; if(S.preg&&x.g)s-=8; if(!m.ext&&x.u==="e")s-=6;
  return{s,why}}
function scoreAssi(x,R,m){
  const fixed=x.c.filter(k=>R.has(k));
  if(!fixed.length&&!show.assi)return{s:-1};
  let s=fixed.length*6+(x.f===1?1:0)-x.k.length*2-(x.tox?4:0);
  if(m.need!=null)s-=Math.abs(x.t-m.need)*.6; if(S.preg&&x.g)s-=8; if(!m.ext&&x.u==="e")s-=6;
  return{s,fixed}}
function scoreEnv(x,m){
  let s=0,why=[];
  if(m.z&&x.e.includes(m.z)){s+=6;why.push("Vers "+ZONE[m.z])}
  if(x.e.includes("harmonie")){s+=3;why.push("Harmonise l'ensemble")}
  if(!s&&!show.env)return{s:-1};
  if(x.a.includes(m.m)||m.s.some(a=>x.a.includes(a)))s+=1;
  x.e.filter(z=>z!=="harmonie"&&z!==m.z).forEach(z=>why.push("Vers "+ZONE[z]));
  if(x.tox)s-=4; if(S.preg&&x.g)s-=8;
  return{s,why}}

/* ---------- Rendu des cartes ---------- */
function card(x,role,on,extra){
  const risks=x.k.map(k=>`<span class="chip risk">${RISK[k].n}</span>`).join("");
  const preg=S.preg&&x.g?'<span class="chip risk">Interdit grossesse</span>':"";
  return `<button class="cand${inRes(x)?"":" dim"}" aria-pressed="${on}" data-role="${role}" data-id="${x.id}">
   <span class="tick">✓</span>
   <span class="nm">${regDot(x.r)}${esc(x.n)} ${natPill(x.t)} ${toxTag(x)}</span>
   <span class="py"><span class="hz">${x.h}</span> · ${esc(x.py)}</span>
   ${extra?`<span class="why">${extra}</span>`:""}
   <span class="chips">${preg}${risks}</span></button>`}

function list(role,items,limit){
  if(!items.length)return `<p class="empty">Aucune plante de ta réserve ne convient. Élargis la réserve ou affiche toutes les plantes.</p>`;
  const sh=show[role]?items:items.slice(0,limit);
  return `<div class="cands">${sh.join("")}</div>`}
function moreBtn(role,total,limit){
  return `<div class="more">${total>limit&&!show[role]?`<button class="lnk" data-more="${role}">Voir les ${total} candidates</button>`:""}<button class="lnk" data-all="${role}">${show[role]?"Revenir aux suggestions":"Afficher toutes les plantes"}</button></div>`}

function rArb(){
  const m=MBY[S.mal],el=$("#s-arb");
  const head=`<div class="step-h"><span class="step-n">2</span><h2>L'Arbitre</h2><span class="role">君 jūn</span></div>
   <p class="hint">La plante principale, celle qui s'attaque au mal central. Les suggestions sont triées par efficacité et par accord avec la nature visée.</p>`;
  if(!m){el.classList.add("locked");el.innerHTML=head+`<p class="empty">Choisis d'abord un mal.</p>`;return}
  el.classList.remove("locked");
  const c=P.filter(x=>inRes(x)||show.arb).map(x=>({x,s:scoreArb(x,m)})).filter(o=>o.s>=0).sort((a,b)=>b.s-a.s);
  const items=c.map(({x})=>card(x,"arb",x.id===S.arb,x.a.filter(a=>a===m.m||m.s.includes(a)).map(a=>ACT[a]).join(" · ")));
  el.innerHTML=head+list("arb",items,8)+moreBtn("arb",items.length,8)}

function rCons(){
  const m=MBY[S.mal],arb=BY[S.arb],el=$("#s-cons");
  const head=`<div class="step-h"><span class="step-n">3</span><h2>Les Conseillers</h2><span class="role">臣 chén</span></div>
   <p class="hint">Un ou deux conseillers renforcent l'arbitre ou traitent un symptôme secondaire.</p>`;
  if(!m||!arb){el.classList.add("locked");el.innerHTML=head+`<p class="empty">Choisis d'abord un arbitre.</p>`;return}
  el.classList.remove("locked");
  const c=P.filter(x=>x.id!==S.arb&&(inRes(x)||show.cons)).map(x=>({x,...scoreCons(x,m,arb)})).filter(o=>o.s>=-0.5||S.cons.includes(o.x.id)).sort((a,b)=>b.s-a.s);
  const items=c.map(o=>card(o.x,"cons",S.cons.includes(o.x.id),(o.why||[]).join(" · ")));
  el.innerHTML=head+list("cons",items,8)+moreBtn("cons",items.length,8)}

function rAssi(){
  const m=MBY[S.mal],el=$("#s-assi");
  const head=`<div class="step-h"><span class="step-n">4</span><h2>Les Assistants</h2><span class="role">佐 zuǒ</span></div>
   <p class="hint">Ils corrigent les défauts de l'arbitre et des conseillers. Chaque suggestion indique le risque qu'elle tempère.</p>`;
  if(!m||!S.arb){el.classList.add("locked");el.innerHTML=head+`<p class="empty">Choisis d'abord un arbitre.</p>`;return}
  el.classList.remove("locked");
  const R=riskSet([S.arb,...S.cons]);
  const covered=covers([...S.assi,S.env].filter(Boolean));
  const open=[...R].filter(k=>!covered.has(k));
  let msg="";
  if(!R.size)msg=`<div class="alert ok">L'arbitre et les conseillers sont doux : aucun risque à corriger. Un assistant reste possible pour harmoniser.</div>`;
  else msg=`<div class="chips" style="margin-bottom:10px">${[...R].map(k=>`<span class="chip ${covered.has(k)?"fix":"risk"}">${covered.has(k)?"✓ ":""}${RISK[k].n}</span>`).join("")}</div>`;
  const RR=R.size?R:new Set(["estomac","violent"]);
  const c=P.filter(x=>![S.arb,...S.cons].includes(x.id)&&(inRes(x)||show.assi)).map(x=>({x,...scoreAssi(x,RR,m)})).filter(o=>o.s>=0||S.assi.includes(o.x.id)).sort((a,b)=>b.s-a.s);
  const items=c.map(o=>card(o.x,"assi",S.assi.includes(o.x.id),(o.fixed||[]).length?"Tempère : "+o.fixed.map(k=>RISK[k].n.toLowerCase()).join(", "):""));
  el.innerHTML=head+msg+list("assi",items,8)+moreBtn("assi",items.length,8)}

function rEnv(){
  const m=MBY[S.mal],el=$("#s-env");
  const head=`<div class="step-h"><span class="step-n">5</span><h2>L'Envoyé</h2><span class="role">使 shǐ</span></div>
   <p class="hint">Il guide la formule vers ${m?ZONE[m.z]:"sa cible"} et harmonise l'ensemble. Par défaut : la réglisse.</p>`;
  if(!m||!S.arb){el.classList.add("locked");el.innerHTML=head+`<p class="empty">Choisis d'abord un arbitre.</p>`;return}
  el.classList.remove("locked");
  const c=P.filter(x=>x.id!==S.arb&&(inRes(x)||show.env)).map(x=>({x,...scoreEnv(x,m)})).filter(o=>o.s>=0||o.x.id===S.env).sort((a,b)=>b.s-a.s);
  const items=c.map(o=>card(o.x,"env",o.x.id===S.env,(o.why||[]).join(" · ")));

/* ---------- Forme ---------- */
function formScores(){
  const m=MBY[S.mal],ids=selIds(),sc={},why={};
  Object.keys(FORMS).forEach(f=>{sc[f]=0;why[f]=[]});
  const add=(f,v,r)=>{sc[f]+=v;if(r&&v>0)why[f].push(r)};
  if(!m||!S.arb)return null;
  ids.forEach(id=>{const x=BY[id],w=id===S.arb?2:1;(x.fm.length?x.fm:["tang"]).forEach(f=>add(f,2*w))});
  const fitN=f=>ids.filter(id=>BY[id].fm.includes(f)).length;
  Object.keys(FORMS).forEach(f=>{const n=fitN(f);if(n)why[f].push(`${n} plante${n>1?"s":""} sur ${ids.length} s'y prête${n>1?"nt":""}`)});
  const c=S.ctx;
  if(c.urgent){add("tang",4,"Urgence : la décoction agit vite");add("inh",m.m==="reveil"?3:0,"Urgence : une inhalation agit sur l'instant");add("san",1);add("wan",-3);add("dan",-5);add("jiu",-1)}
  if(c.voyage){add("san",4,"En voyage : la poudre se transporte");add("wan",3,"En voyage : les pilules se gardent");add("tang",-3);add("dan",-3);add("jiu",-1);add("gao",1)}
  if(c.externe){add("gao",7,"Usage externe : appliqué sur la peau");add("san",3,"Usage externe : saupoudré sur la plaie");add("jiu",1,"Usage externe : en liniment");add("tang",-5);add("wan",-8);add("dan",-8);add("inh",-2)}
  if(c.long){add("wan",4,"Traitement long : action lente et régulière");add("jiu",3,"Traitement long : se conserve des mois");add("dan",3,"Traitement long : nourrit la vie en profondeur");add("inh",-3)}
  if(m.m==="reveil")add("inh",5,"Il faut réveiller : on fait respirer");
  if(["sang-s","plaie"].includes(m.m)){add("san",2,"Une plaie se couvre de poudre");add("gao",2,"Une plaie se couvre d'onguent")}
  if(["chaleur","t-yin","surf-chaud"].includes(m.m))add("jiu",-4);
  if(["sang-c","rechauf","t-yang"].includes(m.m)||(m.m==="douleur"&&m.need!==-1))add("jiu",3,"L'alcool fait circuler et réchauffe");
  if(["t-qi","t-sang","t-yin","t-yang"].includes(m.m)){add("wan",2,"Un tonique se prend dans la durée");add("dan",1)}
  const rare=ids.some(id=>BY[id].rare);
  if(rare)add("dan",3,"Une plante précieuse justifie le raffinage");else add("dan",-3);
  if(ids.some(id=>BY[id].tox))add("wan",2,"Une plante toxique se dose mieux en pilule");
  if(ids.some(id=>BY[id].u==="e")){add("gao",3,"Une plante réservée à l'usage externe");add("tang",-6);add("wan",-6)}
  if(m.ext&&!c.externe)add("gao",1);
  return{sc,why}}

function rForm(){
  const el=$("#s-form"),r=formScores();
  const head=`<div class="step-h"><span class="step-n">6</span><h2>La forme du remède</h2></div>
   <p class="hint">Indique la situation : la forme se calcule d'après elle et d'après les plantes choisies.</p>
   <div class="ctx">${[["urgent","Urgence"],["voyage","En voyage"],["externe","Usage externe"],["long","Traitement long"]].map(([k,l])=>`<button class="tog" data-ctx="${k}" aria-pressed="${!!S.ctx[k]}">${l}</button>`).join("")}</div>`;
  if(!r){el.classList.add("locked");el.innerHTML=head+`<p class="empty">Choisis d'abord un arbitre.</p>`;return}
  el.classList.remove("locked");
  const order=Object.keys(FORMS).sort((a,b)=>r.sc[b]-r.sc[a]);
  const max=Math.max(1,...Object.values(r.sc));
  const best=order[0];
  el.innerHTML=head+`<div class="forms">${order.map(f=>`<div class="frow${f===best?" best":""}"><span class="fn"><span class="hz">${FORMS[f].h}</span>${FORMS[f].n}</span><span class="bar"><i style="width:${Math.max(0,r.sc[f])/max*100}%"></i></span><span class="sc">${Math.max(0,Math.round(r.sc[f]))}</span></div>`).join("")}</div>
   <div class="why-form"><b>${FORMS[best].n} (${FORMS[best].py} ${FORMS[best].h}).</b> ${FORMS[best].d}<ul>${r.why[best].slice(0,4).map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`;
  S._form=best}

/* ---------- Ordonnance ---------- */
function rOrd(){
  const el=$("#ord"),m=MBY[S.mal];
  if(!m||!S.arb){el.innerHTML=`<span class="eyebrow">Ordonnance</span><p class="empty">Choisis un mal et un arbitre : la formule s'écrira ici.</p>`;return}
  const f=S._form||"tang",arb=BY[S.arb],ids=selIds();
  const classic=CLASSIC.find(c=>c.ids.every(i=>ids.includes(i)));
  const title=`${FORMS[f].n} ${deName(arb.n)}`;
  const row=(lbl,hz,id,role)=>{const x=BY[id];return `<li><span class="rl">${lbl}<small>${hz}</small></span><span class="pl"><b>${esc(x.n)}</b> <span class="py">${x.h} · ${esc(x.py)}</span><button class="rm" data-rm="${role}" data-id="${id}" aria-label="Retirer ${esc(x.n)}">retirer</button>${x.pz?`<div class="pz">${esc(x.pz)}</div>`:""}</span></li>`};
  let court=row("Arbitre","君 jūn",S.arb,"arb");
  S.cons.forEach(id=>court+=row("Conseiller","臣 chén",id,"cons"));
  S.assi.forEach(id=>court+=row("Assistant","佐 zuǒ",id,"assi"));
  if(S.env)court+=row("Envoyé","使 shǐ",S.env,"env");
  // nature
  let tw=0,tt=0;ids.forEach(id=>{const w=id===S.arb?2:1;tw+=w;tt+=BY[id].t*w});
  const avg=tt/tw,pos=v=>((v+2)/4*100);
  const tgt=m.need!=null?`<span class="tg" style="left:calc(${pos(Math.max(-2,m.need-.5))}% );width:${pos(Math.min(2,m.need+.5))-pos(Math.max(-2,m.need-.5))}%"></span>`:"";
  // alertes
  const al=[];
  INCOMP.forEach(([a,bs,t])=>{if(ids.includes(a)){const hit=bs.filter(b=>ids.includes(b));if(hit.length)al.push(`<div class="alert"><b>Incompatibilité.</b> ${t}</div>`)}});
  if(S.preg){const g=ids.filter(id=>BY[id].g);if(g.length)al.push(`<div class="alert"><b>Grossesse.</b> ${g.map(id=>BY[id].n).join(", ")} : interdit.</div>`)}
  const R=riskSet([S.arb,...S.cons]),C=covers([...S.assi,S.env].filter(Boolean));
  const open=[...R].filter(k=>!C.has(k));
  if(open.length)al.push(`<div class="alert"><b>Risques non tempérés :</b> ${open.map(k=>RISK[k].n.toLowerCase()).join(", ")}.</div>`);
  ids.filter(id=>BY[id].tox>=2).forEach(id=>al.push(`<div class="alert"><b>${esc(BY[id].n)}.</b> ${BY[id].tox>=3?"Poison sans usage interne.":"Très toxique : préparation et dose exactes indispensables."}</div>`));
  if(m.need!=null&&Math.abs(avg-m.need)>1.4)al.push(`<div class="alert"><b>Nature.</b> La formule est ${NAT[Math.round(Math.max(-2,Math.min(2,avg)))]} alors que le mal demande une formule ${NAT[m.need]}.</div>`);
  if(!al.length)al.push(`<div class="alert ok">Formule équilibrée : aucun risque non tempéré.</div>`);
  if(classic)al.unshift(`<div class="alert gold">Tu as retrouvé une formule classique : <b>${classic.n}</b> <span class="hz">${classic.h}</span>.</div>`);
  // voix de Shuhui
  const voice=[];
  [S.arb,...S.cons].forEach(id=>BY[id].k.forEach(k=>{const by=[...S.assi,S.env].filter(Boolean).find(a=>BY[a].c.includes(k));if(by)voice.push(`« ${BY[id].n} ${RISK[k].p} : ${BY[by].n.toLowerCase()} le tempère. »`)}));
  if(S.env&&BY[S.env].e.includes(m.z))voice.push(`« ${BY[S.env].n} portera le remède vers ${ZONE[m.z]}. »`);
  const sv=[...new Set(voice)].slice(0,4);
  el.innerHTML=`<span class="eyebrow">Ordonnance · ${esc(m.n)}</span>
   <div><h2>${esc(title)}</h2><span class="fhz">${arb.h}${FORMS[f].h}</span></div>
   <ul class="court">${court}</ul>
   <div class="thermo"><span class="eyebrow">Nature de la formule</span><div class="scale">${tgt}<span class="mk" style="left:${pos(avg)}%"></span></div><div class="lg"><span>froide</span><span>neutre</span><span>chaude</span></div></div>
   <div class="alerts">${al.join("")}</div>
   ${sv.length?`<div class="voice"><span class="eyebrow">Shuhui raisonne</span>${sv.map(v=>`<p>${esc(v)}</p>`).join("")}</div>`:""}
   <div class="actions"><button class="btn" id="copy">Copier l'ordonnance</button><button class="btn ghost" id="reset">Tout effacer</button></div>
   <div id="copyfb"></div>`}

function ordText(){
  const m=MBY[S.mal],f=S._form||"tang",arb=BY[S.arb];
  const L=[`${FORMS[f].n} ${deName(arb.n)} (${arb.h}${FORMS[f].h})`,`Pour : ${m.n}`];
  const r=(l,id)=>{const x=BY[id];L.push(`${l} : ${x.n} (${x.py} ${x.h})${x.pz?" – "+x.pz:""}`)};
  r("Arbitre",S.arb);S.cons.forEach(id=>r("Conseiller",id));S.assi.forEach(id=>r("Assistant",id));if(S.env)r("Envoyé",S.env);
  L.push(`Forme : ${FORMS[f].n}. ${FORMS[f].d}`);return L.join("\n")}

function renderCompose(){rReserve();rMal();rArb();rCons();rAssi();rEnv();rForm();rOrd();save()}

/* ---------- Interactions ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.tab){document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b===t));$("#view-compose").hidden=t.dataset.tab!=="compose";$("#view-herbier").hidden=t.dataset.tab!=="herbier";if(t.dataset.tab==="herbier")renderHerb();else renderCompose();return}
  if(t.dataset.mal){S.demo=false;if(S.mal!==t.dataset.mal){S.mal=t.dataset.mal;S.arb=null;S.cons=[];S.assi=[];S.env=null;const m=MBY[S.mal];S.ctx.urgent=!!m.urg;S.ctx.externe=!!m.ext}renderCompose();return}
  if(t.dataset.role){S.demo=false;const id=t.dataset.id,r=t.dataset.role;
    if(r==="arb"){S.arb=S.arb===id?null:id;S.cons=S.cons.filter(x=>x!==id);S.assi=S.assi.filter(x=>x!==id);if(!S.arb){S.cons=[];S.assi=[];S.env=null}}
    else if(r==="env")S.env=S.env===id?null:id;
    else{const L=S[r],max=r==="cons"?2:3;if(L.includes(id))S[r]=L.filter(x=>x!==id);else{if(L.length>=max){toast(`${max} ${r==="cons"?"conseillers":"assistants"} au plus`);return}L.push(id);const o=r==="cons"?"assi":"cons";S[o]=S[o].filter(x=>x!==id)}}
    renderCompose();return}
  if(t.dataset.more){show[t.dataset.more]=true;renderCompose();return}
  if(t.dataset.all){show[t.dataset.all]=!show[t.dataset.all];renderCompose();return}
  if(t.dataset.ctx){const k=t.dataset.ctx;S.ctx[k]=!S.ctx[k];if(k==="voyage"&&S.ctx.voyage)S.ctx.urgent=S.ctx.urgent;renderCompose();return}
  if(t.dataset.rm){const r=t.dataset.rm,id=t.dataset.id;if(r==="arb"){S.arb=null;S.cons=[];S.assi=[];S.env=null}else if(r==="env")S.env=null;else S[r]=S[r].filter(x=>x!==id);renderCompose();return}
  if(t.id==="reset"){S={mal:null,arb:null,cons:[],assi:[],env:null,ctx:{urgent:false,voyage:false,externe:false,long:false},preg:S.preg,regions:S.regions};renderCompose();return}
  if(t.id==="copy"){const txt=ordText();const fb=$("#copyfb");
    const fall=()=>{fb.innerHTML=`<textarea class="copyfb" id="copytxt" readonly>${esc(txt)}</textarea>`;const a=$("#copytxt");a.focus();a.select()};
    try{navigator.clipboard.writeText(txt).then(()=>toast("Ordonnance copiée"),fall)}catch(err){fall()}return}
  if(t.dataset.hreg!==undefined){H.reg=t.dataset.hreg;renderHerb();return}
  if(t.dataset.addto){const id=t.dataset.id,r=t.dataset.addto;
    if(!S.mal){toast("Choisis d'abord un mal dans Composer");return}
    if(r==="arb"){S.arb=id}else if(r==="env"){if(!S.arb){toast("Choisis d'abord un arbitre");return}S.env=id}
    else{if(!S.arb){toast("Choisis d'abord un arbitre");return}if(!S[r].includes(id)&&id!==S.arb)S[r].push(id)}
    S.demo=false;save();toast(`${BY[id].n} ajouté à la formule`);return}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.reg){const k=t.dataset.reg;S.regions=t.checked?[...new Set([...S.regions,k])]:S.regions.filter(x=>x!==k);renderCompose()}
  if(t.id==="preg"){S.preg=t.checked;renderCompose()}
  if(["h-act","h-nat","h-pois"].includes(t.id))renderHerb();
});
document.addEventListener("input",e=>{if(e.target.id==="h-q")renderHerb()});

/* ---------- Herbier ---------- */
const H={reg:"all"};
$("#h-act").innerHTML=`<option value="">Tous les effets</option>`+Object.entries(ACT).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
$("#h-nat").innerHTML=`<option value="">Toutes natures</option>`+[-2,-1,0,1,2].map(t=>`<option value="${t}">${NAT[t]}</option>`).join("");
function renderHerb(){
  $("#h-reg").innerHTML=[["all","Toutes"],...Object.entries(REG).map(([k,v])=>[k,v.n])].map(([k,n])=>`<button class="rchip" data-hreg="${k}" aria-pressed="${H.reg===k}">${k!=="all"?regDot(k):""}${n} <span style="opacity:.7">${k==="all"?P.length:P.filter(x=>x.r===k).length}</span></button>`).join("");
  const q=$("#h-q").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const act=$("#h-act").value,nat=$("#h-nat").value,pois=$("#h-pois").checked;
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const L=P.filter(x=>(H.reg==="all"||x.r===H.reg)&&(!act||x.a.includes(act))&&(nat===""||x.t==+nat)&&(!pois||x.tox>=2)&&
    (!q||norm(x.n+" "+x.py+" "+x.h+" "+x.o+" "+x.x+" "+x.a.map(a=>ACT[a]).join(" ")).includes(q))).sort((a,b)=>a.n.localeCompare(b.n,"fr"));
  $("#h-count").textContent=`${L.length} plante${L.length>1?"s":""}`;
  $("#h-grid").innerHTML=L.map(x=>`<article class="hcard${x.tox>=2?" poison":""}">
    <div class="top"><div><h3>${esc(x.n)}</h3></div><span class="hz">${x.h}</span></div>
    <div class="py">${esc(x.py)} · ${natPill(x.t)} <span style="color:var(--muted)">${esc(x.s)}</span> ${toxTag(x)}</div>
    <div class="orig">${regDot(x.r)}<span><b>${REG[x.r].n}.</b> ${esc(x.o)}</span></div>
    <dl class="kv">
      ${x.a.length?`<dt>Effets</dt><dd>${x.a.map(a=>ACT[a]).join(" · ")}</dd>`:""}
      ${x.k.length?`<dt>Risques</dt><dd class="chips">${x.k.map(k=>`<span class="chip risk">${RISK[k].n}</span>`).join("")}</dd>`:""}
      ${x.c.length?`<dt>Tempère</dt><dd class="chips">${x.c.map(k=>`<span class="chip fix">${RISK[k].n}</span>`).join("")}</dd>`:""}
      ${x.e.length?`<dt>Envoie</dt><dd>${x.e.map(z=>z==="harmonie"?"harmonise":"vers "+ZONE[z]).join(" · ")}</dd>`:""}
      ${x.fm.length?`<dt>Formes</dt><dd>${x.fm.map(f=>FORMS[f].n).join(" · ")}${x.u==="e"?" <b>(usage externe)</b>":""}</dd>`:""}
      ${x.g||x.rare?`<dt>Notes</dt><dd class="chips">${x.g?'<span class="chip risk">Interdit grossesse</span>':""}${x.rare?'<span class="chip gold">Rare et précieuse</span>':""}</dd>`:""}
    </dl>
    <p class="x">${esc(x.x)}</p>
    ${x.pz?`<p class="pz">${esc(x.pz)}</p>`:""}
    ${x.tox<3?`<div class="add">Ajouter comme <button data-addto="arb" data-id="${x.id}">arbitre</button><button data-addto="cons" data-id="${x.id}">conseiller</button><button data-addto="assi" data-id="${x.id}">assistant</button><button data-addto="env" data-id="${x.id}">envoyé</button></div>`:""}
  </article>`).join("")||`<p class="empty">Aucune plante ne correspond.</p>`;
  renderCompose()}

renderCompose();
</script>

</body></html>
